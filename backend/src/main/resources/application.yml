# ==============================================================
# MicroCrew Backend - Application Configuration
# ==============================================================
# All credentials via environment variables. Never hardcode secrets.
# Supabase SQL migrations are the schema source of truth.
# Hibernate validates against existing schema — never creates/modifies.
# ==============================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/microcrew}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:${JWT_ISSUER:}}
          jwk-set-uri: ${SUPABASE_JWKS_URI:${SUPABASE_JWKS_URL:https://placeholder-project.supabase.co/auth/v1/.well-known/jwks.json}}

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
